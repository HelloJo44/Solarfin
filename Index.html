    <title>Solarfin - Overseerr / Moonfin Client</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Solarfin">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darker: '#0b0f19',
                        dark: '#111827',
                        card: '#1f2937',
                        accent: '#f97316',
                        accentHover: '#ea580c'
                    },
                    transitionTimingFunction: {
                        'spring': 'cubic-bezier(0.175, 0.885, 0.32, 1.275)',

        }

<body class="bg-darker text-gray-100 font-sans min-h-screen pb-24 selection:bg-accent selection:text-white">
    <header class="sticky top-0 z-40 glass-panel border-b border-gray-800 px-4 py-3">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-orange-500 to-red-600 flex items-center justify-center shadow-lg shadow-orange-500/30">
                    <i class="fa-solid fa-sun text-white text-sm"></i>
                </div>
                <h1 class="font-bold text-lg tracking-wide bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">Solarfin</h1>
            </div>

            <div class="bg-gray-900/90 p-1 rounded-2xl border border-gray-800 flex items-center shadow-inner">
                <button id="typeMovie" type="button" aria-label="Afficher les films" aria-pressed="true" onclick="switchMediaType('movie')" class="px-4 py-1.5 rounded-xl text-xs font-semibold transition-all duration-300 bg-accent text-white shadow-md">Films</button>
                <button id="typeTv" type="button" aria-label="Afficher les séries" aria-pressed="false" onclick="switchMediaType('tv')" class="px-4 py-1.5 rounded-xl text-xs font-semibold transition-all duration-300 text-gray-400 hover:text-white">Séries</button>
            </div>

            <button type="button" aria-label="Ouvrir les paramètres" onclick="openSettings()" class="w-9 h-9 rounded-xl bg-gray-800/80 border border-gray-700/60 flex items-center justify-center text-gray-300 hover:text-white hover:bg-gray-700 shadow-md spring-active">
                <i class="fa-solid fa-gear text-sm"></i>
            </button>
        </div>

        <div class="max-w-7xl mx-auto mt-3 flex items-center gap-2">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" id="searchInput" aria-label="Rechercher un titre" oninput="handleSearch()" placeholder="Rechercher un titre..." class="w-full bg-gray-900/90 border border-gray-800 rounded-xl pl-9 pr-4 py-2 text-sm text-gray-100 placeholder:text-gray-500 focus:outline-none focus:border-accent">
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-4 space-y-6">
        <section class="space-y-2">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-compass text-accent"></i> Sources de recommandations
                </h2>
                <span id="sourcesCount" class="text-[10px] text-gray-500 font-medium">1 sélectionnée</span>
            </div>
            <div id="sourcesContainer" class="flex gap-2 overflow-x-auto no-scrollbar pb-1" aria-label="Sources de recommandations"></div>
        </section>

        <section class="space-y-2">
            <div class="flex items-center justify-between">
                <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-tv text-purple-400"></i> Filtrer par plateforme
                </h2>
                <button type="button" aria-label="Tout ou aucun plateforme" onclick="toggleAllPlatforms()" class="text-[10px] text-accent hover:underline font-medium">Tout / Aucun</button>
            </div>
            <div id="platformsContainer" class="flex gap-2 overflow-x-auto no-scrollbar pb-1" aria-label="Plateformes"></div>
        </section>

        <section class="space-y-2">
            <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 flex items-center gap-1.5">
                <i class="fa-solid fa-tags text-amber-400"></i> Genres & Thématiques
            </h2>
            <div id="genresContainer" class="flex gap-2 overflow-x-auto no-scrollbar pb-1" aria-label="Genres"></div>
        </section>

        <section class="space-y-3">
            <div class="flex items-center justify-between">
                <h2 id="catalogueTitle" class="text-sm font-bold text-gray-200">Catalogue & Suggestions</h2>
                <span id="resultsCount" class="text-xs text-gray-500">0 résultat</span>

            <div id="mediaGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5" aria-live="polite"></div>
        </section>
    </main>

    <div id="trailerModal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-3xl rounded-2xl overflow-hidden shadow-2xl relative flex flex-col max-h-[90vh]">

                <h3 id="trailerTitle" class="font-bold text-sm text-white truncate">Bande-annonce</h3>
                <button type="button" aria-label="Fermer la bande-annonce" onclick="closeTrailerModal()" class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            <div class="relative w-full aspect-video bg-black flex items-center justify-center" id="trailerContainer"></div>
        </div>
    </div>

    <div id="detailModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-gray-900 border-t sm:border border-gray-800 w-full max-w-lg rounded-t-3xl sm:rounded-2xl overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
            <div class="relative w-full aspect-[16/9] bg-gray-950" id="modalBackdrop">
                <div class="absolute inset-0 bg-gradient-to-t from-gray-900 via-gray-900/40 to-transparent"></div>
                <button type="button" aria-label="Fermer la fiche" onclick="closeDetailModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-black/60 backdrop-blur-md flex items-center justify-center text-white hover:bg-black/80">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            <div class="p-5 space-y-4 overflow-y-auto flex-1">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <span id="modalRating" class="px-2 py-0.5 rounded-lg bg-amber-500/20 text-amber-400 text-xs font-bold border border-amber-500/30">★ 0.0</span>
                        <span id="modalYear" class="text-xs text-gray-400 font-medium">2026</span>
                        <div id="modalPlatforms" class="flex gap-1 ml-auto flex-wrap justify-end"></div>
                    </div>
                    <h3 id="modalTitle" class="text-xl font-bold text-white tracking-tight">Titre du film</h3>
                    <div id="modalGenres" class="flex flex-wrap gap-1.5 mt-2"></div>
                </div>
                <p id="modalOverview" class="text-xs text-gray-300 leading-relaxed"></p>

                <div class="pt-2 flex gap-3">
                    <button id="modalTrailerBtn" type="button" aria-label="Voir la bande-annonce" onclick="" class="flex-1 bg-gray-800 hover:bg-gray-700 text-white font-semibold py-3 px-4 rounded-xl text-xs flex items-center justify-center gap-2 spring-active">
                        <i class="fa-solid fa-play text-accent"></i> Bande-annonce
                    </button>
                    <button id="modalRequestBtn" type="button" aria-label="Envoyer la demande à Overseerr ou Moonfin" onclick="" class="flex-2 bg-gradient-to-r from-accent to-red-600 hover:from-accentHover hover:to-red-700 text-white font-semibold py-3 px-4 rounded-xl text-xs flex items-center justify-center gap-2 spring-active">
                        <i class="fa-solid fa-paper-plane"></i> Envoyer à Overseerr / Moonfin
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 w-full max-w-md rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex items-center justify-between p-4 border-b border-gray-800">
                <h3 class="font-bold text-sm text-white flex items-center gap-2"><i class="fa-solid fa-gear text-accent"></i> Paramètres</h3>
                <button type="button" aria-label="Fermer les paramètres" onclick="closeSettings()" class="w-8 h-8 rounded-full bg-gray-800 flex items-center justify-center text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            <div class="p-5 space-y-4 overflow-y-auto flex-1 text-xs">
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-gray-400 font-medium">Clé API TMDB</label>
                        <a href="https://www.themoviedb.org/settings/api" target="_blank" class="text-[10px] text-accent hover:underline flex items-center gap-1">
                            <i class="fa-solid fa-external-link-alt"></i> Créer une clé TMDB
                        </a>
                    </div>
                    <input type="text" id="settingTmdbKey" placeholder="Votre clé API v3 TMDB" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-gray-200 focus:outline-none focus:border-accent">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-medium">URL Overseerr / Moonfin</label>
                    <input type="text" id="settingServerUrl" placeholder="https://overseerr.monserveur.com" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-gray-200 focus:outline-none focus:border-accent">
                </div>
                <div>
                    <label class="block text-gray-400 mb-1 font-medium">Clé API Overseerr / Moonfin</label>
                    <input type="password" id="settingServerKey" placeholder="Clé API Overseerr" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-gray-200 focus:outline-none focus:border-accent">
                </div>
                <button type="button" aria-label="Enregistrer les paramètres" onclick="saveSettings()" class="w-full bg-accent hover:bg-accentHover text-white font-semibold py-2.5 rounded-xl transition-all shadow-lg shadow-accent/20 spring-active">
                    Enregistrer les paramètres
                </button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_PASS = 'Solarfin-Local-Obfuscation-Key-v1';

        function xorEncrypt(value, pass) {
            if (!value) return '';
            const valueChars = Array.from(value);
            const passChars = Array.from(pass);
            let encoded = '';
            for (let i = 0; i < valueChars.length; i++) {
                const charCode = valueChars[i].charCodeAt(0) ^ passChars[i % passChars.length].charCodeAt(0);
                encoded += String.fromCharCode(charCode);
            }
            return btoa(encoded);
        }

        function xorDecrypt(value, pass) {
            if (!value) return '';
            try {
                const decoded = atob(value);
                const passChars = Array.from(pass);
                let result = '';
                for (let i = 0; i < decoded.length; i++) {
                    const charCode = decoded.charCodeAt(i) ^ passChars[i % passChars.length].charCodeAt(0);
                    result += String.fromCharCode(charCode);
                }
                return result;
            } catch (e) {
                return '';
            }
        }

        function saveEncryptedValue(name, value) {
            localStorage.setItem(name, xorEncrypt(value, STORAGE_PASS));
        }

        function loadEncryptedValue(name) {
            const raw = localStorage.getItem(name);
            return raw ? xorDecrypt(raw, STORAGE_PASS) : '';
        }

        function saveJsonValue(name, value) {
            localStorage.setItem(name, JSON.stringify(value));
        }

        function loadJsonValue(name, fallback = []) {
            try {
                const raw = localStorage.getItem(name);
                return raw ? JSON.parse(raw) : fallback;
            } catch (e) {
                return fallback;
            }
        }

        let currentMediaType = 'movie';
        let selectedSources = new Set(['trending']);
        let selectedPlatforms = new Set(['netflix', 'prime', 'disney', 'apple', 'canal', 'ocs', 'hbo']);
        let selectedGenres = new Set(['all']);
        let searchQuery = '';
        let mediaCache = [];
        let lastRequestedItem = null;
        let searchTimeout = null;

        let config = {
            tmdbKey: loadEncryptedValue('streamhub_tmdb') || '',
            serverUrl: loadEncryptedValue('streamhub_url') || '',
            serverKey: loadEncryptedValue('streamhub_key') || ''
        };

        const platformData = {
            netflix: { name: 'Netflix', color: 'bg-red-600', providerIds: [8], aliases: ['netflix'] },
            prime: { name: 'Prime Video', color: 'bg-cyan-600', providerIds: [9], aliases: ['prime video', 'amazon prime video'] },
            disney: { name: 'Disney+', color: 'bg-blue-600', providerIds: [337], aliases: ['disney+', 'disney plus'] },
            apple: { name: 'Apple TV+', color: 'bg-gray-700', providerIds: [350], aliases: ['apple tv+', 'apple tv'] },
            canal: { name: 'Canal+', color: 'bg-amber-600', providerIds: [381], aliases: ['canal+', 'canal'] },
            paramount: { name: 'Paramount+', color: 'bg-blue-800', providerIds: [531], aliases: ['paramount+', 'paramount plus'] },
            ocs: { name: 'OCS', color: 'bg-violet-600', providerIds: [228, 252, 267], aliases: ['ocs', 'ocs go'] },
            hbo: { name: 'HBO', color: 'bg-yellow-600', providerIds: [118, 384, 435], aliases: ['hbo', 'hbo max', 'max'] }
        };

        const genreMap = {
            movie: {
                28: 'Action', 12: 'Aventure', 16: 'Animation', 35: 'Comédie',
                80: 'Policier', 99: 'Documentaire', 18: 'Drame', 10751: 'Famille',
                14: 'Fantastique', 36: 'Histoire', 27: 'Horreur', 9648: 'Mystère',
                10749: 'Romance', 878: 'Sci-Fi', 53: 'Thriller', 10752: 'Guerre', 37: 'Western'
            },
            tv: {
                10759: 'Action & Aventure', 16: 'Animation', 35: 'Comédie', 80: 'Crime',
                99: 'Documentaire', 18: 'Drame', 10751: 'Famille', 10762: 'Kids',
                9648: 'Mystère', 10763: 'News', 10764: 'Reality', 10765: 'Sci-Fi & Fantasy',
                10766: 'Soap', 10768: 'War & Politics', 37: 'Western'
            }
        };

        const sourcesConfig = {
            movie: [
                { id: 'trending', label: 'TMDB Tendances' },
                { id: 'session', label: 'Inspiré de votre séance' },
                { id: 'telerama', label: 'Télérama Sorties' },
                { id: 'senscritique', label: 'SensCritique Top' },
                { id: 'presse', label: 'Presse & Médias' }
            ],
            tv: [
                { id: 'trending', label: 'Tendances Séries' },
                { id: 'betaseries', label: 'BetaSeries Sorties' },
                { id: 'senscritique_tv', label: 'SensCritique Séries' },
                { id: 'allocine_tv', label: 'Allociné Séries' },
                { id: 'tvguide', label: 'TV Guide' }
            ]
        };

        function restoreSelections() {
            const savedSources = loadJsonValue('streamhub_sources', ['trending']);
            const savedPlatforms = loadJsonValue('streamhub_platforms', Object.keys(platformData));
            const savedGenres = loadJsonValue('streamhub_genres', ['all']);
            if (Array.isArray(savedSources) && savedSources.length) selectedSources = new Set(savedSources);
            if (Array.isArray(savedPlatforms) && savedPlatforms.length) selectedPlatforms = new Set(savedPlatforms);
            if (Array.isArray(savedGenres) && savedGenres.length) selectedGenres = new Set(savedGenres);
        }

        function persistSelections() {
            saveJsonValue('streamhub_sources', Array.from(selectedSources));
            saveJsonValue('streamhub_platforms', Array.from(selectedPlatforms));
            saveJsonValue('streamhub_genres', Array.from(selectedGenres));
        }

        function fetchWithRetry(url, maxRetries = 3, delay = 800) {
            return new Promise(async (resolve, reject) => {
                for (let attempt = 0; attempt < maxRetries; attempt++) {
                    try {
                        const response = await fetch(url);
                        if (!response.ok) {
                            if (attempt === maxRetries - 1) return reject(new Error('HTTP ' + response.status));
                            await new Promise(r => setTimeout(r, delay * (attempt + 1)));
                            continue;
                        }
                        return resolve(response);
                    } catch (error) {
                        if (attempt === maxRetries - 1) return reject(error);
                        await new Promise(r => setTimeout(r, delay * (attempt + 1)));
                    }
                }
            });
        }

        function normalizeProviderKey(providerName = '', providerId = null) {
            const name = String(providerName || '').toLowerCase();
            for (const [key, data] of Object.entries(platformData)) {
                if (providerId !== null && data.providerIds.includes(Number(providerId))) return key;
                if (data.aliases.some(alias => name.includes(alias.toLowerCase()))) return key;
            }
            return null;
        }

        function mapWatchProvidersToPlatformKeys(watchProviders = {}) {
            const keys = new Set();
            ['flatrate', 'rent', 'buy', 'ads'].forEach(groupName => {
                (watchProviders[groupName] || []).forEach(provider => {
                    const key = normalizeProviderKey(provider.provider_name, provider.provider_id);
                    if (key) keys.add(key);
                });
            });
            return [...keys];
        }

        function getFallbackPlatformKey(itemId) {
            const keys = Object.keys(platformData);
            return keys[Math.abs(Number(itemId) || 0) % keys.length];
        }

        async function enrichItemsWithProviders(items) {
            if (!items.length) return items;
            const enriched = await Promise.all(items.map(async (item) => {
                const baseKey = getFallbackPlatformKey(item.id);
                try {
                    const response = await fetchWithRetry(`https://api.themoviedb.org/3/${currentMediaType}/${item.id}/watch/providers?api_key=${config.tmdbKey}`);
                    const data = await response.json();
                    const providerKeys = mapWatchProvidersToPlatformKeys(data.results && data.results.FR ? data.results.FR : data.results || {});
                    return { ...item, platformKeys: providerKeys.length ? providerKeys : [baseKey], primaryPlatformKey: providerKeys[0] || baseKey };
                } catch (error) {
                    return { ...item, platformKeys: [baseKey], primaryPlatformKey: baseKey };
                }
            }));
            return enriched;
        }

        document.addEventListener('DOMContentLoaded', () => {
            restoreSelections();
            initSources();
            initPlatforms();
            initGenres();
            loadCatalogue();
        });

        function switchMediaType(type) {
            currentMediaType = type;
            document.getElementById('typeMovie').className = type === 'movie' ? 'px-4 py-1.5 rounded-xl text-xs font-semibold transition-all duration-300 bg-accent text-white shadow-md' : 'px-4 py-1.5 rounded-xl text-xs font-semibold transition-all duration-300 text-gray-400 hover:text-white';
            document.getElementById('typeTv').className = type === 'tv' ? 'px-4 py-1.5 rounded-xl text-xs font-semibold transition-all duration-300 bg-accent text-white shadow-md' : 'px-4 py-1.5 rounded-xl text-xs font-semibold transition-all duration-300 text-gray-400 hover:text-white';
            document.getElementById('typeMovie').setAttribute('aria-pressed', type === 'movie' ? 'true' : 'false');
            document.getElementById('typeTv').setAttribute('aria-pressed', type === 'tv' ? 'true' : 'false');
            selectedSources.clear();
            selectedSources.add('trending');
            selectedGenres.clear();
            selectedGenres.add('all');
            initSources();
            initGenres();
            persistSelections();
            loadCatalogue();
        }

        function initSources() {
            const container = document.getElementById('sourcesContainer');
            const sources = sourcesConfig[currentMediaType];
            container.innerHTML = sources.map(src => {
                const active = selectedSources.has(src.id);
                const buttonClasses = active ? 'bg-accent text-white shadow-md' : 'bg-gray-800/80 text-gray-300 hover:text-white hover:bg-gray-700';
                return `<button type="button" aria-label="${src.label}" aria-pressed="${active ? 'true' : 'false'}" onclick="toggleSource('${src.id}')" class="px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all flex items-center gap-1.5 ${buttonClasses}"><i class="fa-solid ${active ? 'fa-check text-[10px]' : 'fa-plus text-[10px]'}"></i> ${src.label}</button>`;
            }).join('');
            updateSourcesCount();
        }

        function toggleSource(id) {
            if (selectedSources.has(id)) {
                if (selectedSources.size > 1) selectedSources.delete(id);
            } else {
                selectedSources.add(id);
            }
            initSources();
            persistSelections();
            loadCatalogue();
        }

        function updateSourcesCount() {
            document.getElementById('sourcesCount').innerText = `${selectedSources.size} sélectionnée${selectedSources.size > 1 ? 's' : ''}`;
        }

        function initPlatforms() {
            const container = document.getElementById('platformsContainer');
            container.innerHTML = Object.entries(platformData).map(([key, p]) => {
                const active = selectedPlatforms.has(key);
                return `<button type="button" aria-label="${p.name}" aria-pressed="${active ? 'true' : 'false'}" onclick="togglePlatform('${key}')" class="px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all flex items-center gap-1.5 ${active ? `${p.color} text-white shadow-md` : 'bg-gray-800/80 text-gray-300 hover:text-white hover:bg-gray-700'}"><span class="w-2 h-2 rounded-full ${active ? 'bg-white' : 'bg-gray-500'}"></span> ${p.name}</button>`;
            }).join('');
        }

        function togglePlatform(key) {
            if (selectedPlatforms.has(key)) {
                if (selectedPlatforms.size > 1) selectedPlatforms.delete(key);
            } else {
                selectedPlatforms.add(key);
            }
            initPlatforms();
            persistSelections();
            applyFilters();
        }

        function toggleAllPlatforms() {
            if (selectedPlatforms.size === Object.keys(platformData).length) {
                selectedPlatforms.clear();
                selectedPlatforms.add(Object.keys(platformData)[0]);
            } else {
                Object.keys(platformData).forEach(k => selectedPlatforms.add(k));
            }
            initPlatforms();
            persistSelections();
            applyFilters();
        }

        function initGenres() {
            const container = document.getElementById('genresContainer');
            const genres = genreMap[currentMediaType];
            let html = `<button type="button" aria-label="Tous genres" aria-pressed="${selectedGenres.has('all') ? 'true' : 'false'}" onclick="setGenre('all')" class="px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all ${selectedGenres.has('all') ? 'bg-accent text-white' : 'bg-gray-800/80 text-gray-300 hover:text-white hover:bg-gray-700'}">Tous</button>`;
            html += Object.entries(genres).map(([id, name]) => {
                const active = selectedGenres.has(id);
                return `<button type="button" aria-label="${name}" aria-pressed="${active ? 'true' : 'false'}" onclick="setGenre('${id}')" class="px-3 py-1.5 rounded-xl text-xs font-medium whitespace-nowrap transition-all ${active ? 'bg-accent text-white' : 'bg-gray-800/80 text-gray-300 hover:text-white hover:bg-gray-700'}">${name}</button>`;
            }).join('');
            container.innerHTML = html;
        }

        function setGenre(id) {
            if (id === 'all') {
                selectedGenres.clear();
                selectedGenres.add('all');
            } else {
                selectedGenres.delete('all');
                if (selectedGenres.has(id)) {
                    selectedGenres.delete(id);
                    if (selectedGenres.size === 0) selectedGenres.add('all');
                } else {
                    selectedGenres.add(id);
                }
            }
            initGenres();
            persistSelections();
            applyFilters();
        }

        async function loadCatalogue() {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = `<div class="col-span-full py-12 flex justify-center"><i class="fa-solid fa-spinner fa-spin text-accent text-2xl"></i></div>`;
            if (!config.tmdbKey) {
                grid.innerHTML = `<div class="col-span-full py-8 text-center text-xs text-yellow-400">Entrez votre clé TMDB dans les paramètres pour lancer le catalogue.</div>`;
                return;
            }
            try {
                let items = [];
                const url = `https://api.themoviedb.org/3/trending/${currentMediaType}/week?api_key=${config.tmdbKey}&language=fr-FR`;
                const res = await fetchWithRetry(url);
                const data = await res.json();
                if (data.results) {
                    items = data.results.map(item => ({
                        id: item.id,
                        title: item.title || item.name,
                        overview: item.overview || 'Aucun synopsis disponible.',
                        poster: item.poster_path ? `https://image.tmdb.org/t/p/w500${item.poster_path}` : 'https://via.placeholder.com/500x750?text=Pas+d+affiche',
                        backdrop: item.backdrop_path ? `https://image.tmdb.org/t/p/original${item.backdrop_path}` : '',
                        rating: item.vote_average ? Number(item.vote_average).toFixed(1) : 'N/A',
                        year: (item.release_date || item.first_air_date || '2026').substring(0, 4),
                        genre_ids: item.genre_ids || [],
                        sourceFeed: Array.from(selectedSources)[0] || 'trending',
                        platformKeys: [],
                        primaryPlatformKey: 'netflix'
                    }));
                }
                mediaCache = await enrichItemsWithProviders(items);
                applyFilters();
            } catch (err) {
                console.error(err);
                grid.innerHTML = `<div class="col-span-full py-8 text-center text-xs text-red-400">Erreur lors du chargement des données. Vérifiez votre clé API TMDB dans les paramètres.</div>`;
            }
        }

        function handleSearch() {
            clearTimeout(searchTimeout);
            searchQuery = document.getElementById('searchInput').value.toLowerCase();
            searchTimeout = setTimeout(() => applyFilters(), 300);
        }

        function applyFilters() {
            let filtered = mediaCache.filter(item => {
                if (searchQuery && !item.title.toLowerCase().includes(searchQuery)) return false;
                const itemPlatformKeys = item.platformKeys && item.platformKeys.length ? item.platformKeys : [item.primaryPlatformKey || 'netflix'];
                const matchesPlatform = Array.from(selectedPlatforms).some(key => itemPlatformKeys.includes(key));
                if (!matchesPlatform) return false;
                if (!selectedGenres.has('all')) {
                    const matchesGenre = item.genre_ids.some(gId => selectedGenres.has(String(gId)));
                    if (!matchesGenre) return false;
                }
                return true;
            });
            renderGrid(filtered);
        }

        function renderGrid(items) {
            const grid = document.getElementById('mediaGrid');
            document.getElementById('resultsCount').innerText = `${items.length} résultat${items.length > 1 ? 's' : ''}`;
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-xs text-gray-500">Aucun résultat ne correspond à vos critères.</div>`;
                return;
            }
            grid.innerHTML = items.map(item => {
                const primaryKey = item.primaryPlatformKey || item.platformKeys?.[0] || 'netflix';
                const plat = platformData[primaryKey] || platformData.netflix;
                return `<div onclick="openDetailModal(${item.id})" class="bg-gray-900 rounded-2xl overflow-hidden border border-gray-800/80 shadow-lg flex flex-col group spring-active cursor-pointer relative" role="button" tabindex="0" aria-label="Ouvrir ${item.title}"><div class="relative aspect-[2/3] w-full bg-gray-950 overflow-hidden"><img src="${item.poster}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy"><div class="absolute top-2 left-2 px-2 py-0.5 rounded-lg ${plat.color} text-white text-[10px] font-bold shadow-md">${plat.name}</div><div class="absolute top-2 right-2 px-2 py-0.5 rounded-lg bg-black/70 backdrop-blur-md text-amber-400 text-[10px] font-bold border border-white/10 flex items-center gap-1"><i class="fa-solid fa-star text-[9px]"></i> ${item.rating}</div><div class="absolute inset-x-0 bottom-0 poster-gradient p-3 pt-8 flex flex-col justify-end"><h3 class="font-bold text-xs text-white truncate">${item.title}</h3><div class="flex items-center gap-2 mt-0.5"><span class="text-[10px] text-gray-400 font-medium">${item.year}</span></div><p class="text-[10px] text-gray-300 line-clamp-2 mt-1 leading-tight">${item.overview}</p></div></div></div>`;
            }).join('');
        }

        async function openDetailModal(id) {
            const item = mediaCache.find(m => m.id === id);
            if (!item) return;
            lastRequestedItem = item;
            document.getElementById('modalTitle').innerText = item.title;
            document.getElementById('modalYear').innerText = item.year;
            document.getElementById('modalRating').innerText = `★ ${item.rating}`;
            document.getElementById('modalOverview').innerText = item.overview;
            const backdrop = document.getElementById('modalBackdrop');
            backdrop.style.backgroundImage = `url(${item.backdrop || item.poster})`;
            backdrop.style.backgroundSize = 'cover';
            backdrop.style.backgroundPosition = 'center';
            const platformBadges = (item.platformKeys && item.platformKeys.length ? item.platformKeys : [item.primaryPlatformKey || 'netflix']).map(key => {
                const data = platformData[key] || platformData.netflix;
                return `<span class="px-2 py-0.5 rounded-lg ${data.color} text-white text-[10px] font-bold">${data.name}</span>`;
            }).join('');
            document.getElementById('modalPlatforms').innerHTML = platformBadges;
            const genresObj = genreMap[currentMediaType];
            document.getElementById('modalGenres').innerHTML = (item.genre_ids || []).map(gId => {
                const label = genresObj[gId];
                return label ? `<span class="px-2 py-0.5 rounded-md bg-gray-800 text-gray-300 text-[10px] font-medium border border-gray-700">${label}</span>` : '';
            }).join('');
            document.getElementById('modalTrailerBtn').setAttribute('onclick', `openTrailer(${item.id})`);
            document.getElementById('modalRequestBtn').setAttribute('onclick', `sendRequest(${item.id})`);
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        async function openTrailer(id) {
            closeDetailModal();
            const modal = document.getElementById('trailerModal');
            const container = document.getElementById('trailerContainer');
            modal.classList.remove('hidden');
            container.innerHTML = `<div class="py-12 flex justify-center"><i class="fa-solid fa-spinner fa-spin text-accent text-2xl"></i></div>`;
            try {
                const res = await fetchWithRetry(`https://api.themoviedb.org/3/${currentMediaType}/${id}/videos?api_key=${config.tmdbKey}&language=fr-FR`);
                const data = await res.json();
                let trailer = data.results && data.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
                if (!trailer) {
                    const resEn = await fetchWithRetry(`https://api.themoviedb.org/3/${currentMediaType}/${id}/videos?api_key=${config.tmdbKey}`);
                    const dataEn = await resEn.json();
                    trailer = dataEn.results && dataEn.results.find(v => v.type === 'Trailer' && v.site === 'YouTube');
                }
                if (trailer) {
                    container.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${trailer.key}?autoplay=1" class="w-full h-full" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                } else {
                    container.innerHTML = `<div class="py-12 text-center text-xs text-gray-400">Aucune bande-annonce disponible pour ce titre.</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="py-12 text-center text-xs text-red-400">Erreur lors du chargement de la bande-annonce.</div>`;
            }
        }

        function closeTrailerModal() {
            document.getElementById('trailerModal').classList.add('hidden');
            document.getElementById('trailerContainer').innerHTML = '';
        }

        async function sendRequest(id) {
            const item = mediaCache.find(m => m.id === id);
            if (!config.serverUrl || !config.serverKey) {
                alert('Veuillez configurer l\'URL et la clé API Seer dans les paramètres.');
                openSettings();
                return;
            }
            try {
                const res = await fetch(`${config.serverUrl}/api/v1/request`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Api-Key': config.serverKey
                    },
                    body: JSON.stringify({
                        mediaType: currentMediaType,
                        mediaId: Number(id)
                    })
                });
                
                if (!res.ok) {
                    const errText = await res.text();
                    alert(`Erreur serveur (${res.status}): ${errText || 'Impossible d\'envoyer la demande'}`);
                    return;
                }
        
                alert(`Demande pour "${item.title}" envoyée avec succès à Seer !`);
                closeDetailModal();
            } catch (err) {
                console.error(err);
                alert('Impossible de contacter le serveur Seer. Vérifiez l\'URL (ex: http://192.168.1.X:5055) et le réseau.');
            }
        }
    




        
        function openSettings() {
            document.getElementById('settingTmdbKey').value = config.tmdbKey;
            document.getElementById('settingServerUrl').value = config.serverUrl;
            document.getElementById('settingServerKey').value = config.serverKey;
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            config.tmdbKey = document.getElementById('settingTmdbKey').value.trim();
            config.serverUrl = document.getElementById('settingServerUrl').value.trim().replace(/\/+$/, '');
            config.serverKey = document.getElementById('settingServerKey').value.trim();
            localStorage.removeItem('streamhub_tmdb');
            localStorage.removeItem('streamhub_url');
            localStorage.removeItem('streamhub_key');
            saveEncryptedValue('streamhub_tmdb', config.tmdbKey);
            saveEncryptedValue('streamhub_url', config.serverUrl);
            saveEncryptedValue('streamhub_key', config.serverKey);
            closeSettings();
            loadCatalogue();
            alert('Paramètres enregistrés avec succès !');
        }
